name: Build Qt5 (nftables)

on:
  push:
    branches: [nftables]
  pull_request:
    branches: [nftables]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-qt5-nftables
  cancel-in-progress: true

jobs:
  build-qt5:
    name: Build FWB Qt5 incl. native nftables
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the nftables branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Qt5 and legacy build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential qtbase5-dev qtbase5-dev-tools qttools5-dev qt5-qmake \
            autoconf automake libtool gettext pkg-config \
            libxml2-dev libxslt1-dev zlib1g-dev flex bison \
            nftables

      - name: Configure Autotools and qmake (Qt5)
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          command -v qmake
          qmake -v 2>&1 | tee ci-logs/qmake.log
          qmake -v 2>&1 | grep -Eq 'Qt version 5\.' || {
            echo 'Refusing to build the Qt5 tree with a non-Qt5 qmake' >&2
            exit 1
          }
          bash ./autogen.sh --prefix=/usr --with-qmake=qmake 2>&1 | tee ci-logs/configure.log

      - name: Compile full tree including fwb_nft
        run: |
          set -euo pipefail
          make -j"$(nproc)" 2>&1 | tee ci-logs/build.log

      - name: Summarize compile errors
        if: ${{ failure() }}
        run: |
          set -euo pipefail
          grep -nE 'error:|Project ERROR|No such file|undefined reference' ci-logs/build.log ci-logs/configure.log 2>/dev/null | tail -80 > ci-logs/errors.log || true
          tail -80 ci-logs/errors.log || true

      - name: Inventory compiled policy compilers
        run: |
          set -euo pipefail
          find . -type f \
            \( -name fwb_ipt -o -name fwb_pf -o -name fwb_ipf \
            -o -name fwb_ipfw -o -name fwb_nft \) \
            -perm /111 -print | sort | tee ci-logs/compiler-binaries.log
          test -s ci-logs/compiler-binaries.log || {
            echo 'Build completed without discovering any policy compiler binaries' >&2
            exit 1
          }
          grep -E '/fwb_nft$' ci-logs/compiler-binaries.log || {
            echo 'Native fwb_nft missing from compiled inventory' >&2
            exit 1
          }

      - name: Smoke-test the native nftables CLI
        run: |
          set -euo pipefail
          compiler="$(find src/nft -type f -name fwb_nft -perm /111 -print -quit)"
          test -n "$compiler"
          "$compiler" -V 2>&1 | tee ci-logs/nft-version.log
          test -s src/res/configlets/nftables/script_body_nftables_atomic
          test -s src/res/configlets/nftables/nft_script_skeleton
          test -s src/res/platform/nftables.xml
          echo 'Native fwb_nft built and smoke-tested.'

      - name: Compile nft-test firewall and validate native nftables structure
        run: |
          set -euo pipefail
          compiler="$(find src/nft -type f -name fwb_nft -perm /111 -print -quit)"
          test -n "$compiler"
          # The native backend uses libfwbuilder's compiled RES_DIR, not the repo tree.
          sudo make -C src/res install
          sudo make -C src/libfwbuilder/etc install
          resource_dir="$(awk '$1 == "#define" && $2 == "RES_DIR" { gsub(/"/, "", $3); print $3; exit }' src/libfwbuilder/src/fwbuilder/libfwbuilder-config.h)"
          test -n "$resource_dir" || { echo 'Native nft: RES_DIR missing' >&2; exit 1; }
          test -s "$resource_dir/resources.xml" || { echo "Native nft: missing $resource_dir/resources.xml" >&2; exit 1; }
          test -s "$resource_dir/fwbuilder.dtd" || { echo "Native nft: missing $resource_dir/fwbuilder.dtd" >&2; exit 1; }
          test -d "$resource_dir/configlets/nftables" || { echo 'Native nft: nftables configlets missing' >&2; exit 1; }
          mkdir -p ci-logs/nft-output
          "$compiler" -f "$PWD/src/unit_tests/generatedScriptTestsNft/test1.fwb" \
            -d "$PWD/ci-logs/nft-output" nft-test \
            2>&1 | tee ci-logs/nft-compile.log
          find ci-logs/nft-output -type f -print | sort | tee ci-logs/nft-generated-files.log
          test -s ci-logs/nft-generated-files.log || {
            echo "fwb_nft returned without generating policy output" >&2
            exit 1
          }
          # A non-empty output file alone is not a native nftables test.
          # Reject known legacy commands, placeholders and restore markers.
          if grep -nE '\$IP(TABLES|6TABLES)|(^|[[:space:]])echo[[:space:]]+.*(COMMIT|\*(filter|nat|mangle|raw))|--to-(source|destination)|-j (SNAT|DNAT)|\{\{opt_wait\}\}' \
              ci-logs/nft-output/*.fw; then
            echo 'Native nftables output contains legacy syntax' >&2
            exit 1
          fi
          # Validate nftables structure, not merely CLI exit status or output size.
          # Static check only: no policy is loaded into the kernel.
          sh ci/check-nft-output.sh ci-logs/nft-output/*.fw \
            2>&1 | tee ci-logs/nft-structure.log
          echo 'Native nftables CLI and structural checks passed; no policy installed.'

      - name: Compile expanded native FWB XML test matrix
        run: |
          set -euo pipefail
          bash ci/check-nft-project-fixtures.sh \
            "$PWD/src/nft/fwb_nft" \
            "$PWD/src/unit_tests/generatedScriptTestsNft/test1.fwb" \
            ci-logs/nft-output 2>&1 | tee ci-logs/nft-fixture-results.log

      - name: Verify central prolog/epilog hooks with fwb_nft
        run: |
          set -euo pipefail
          bash ci/check-central-hooks.sh \
            "$PWD/src/nft/fwb_nft" \
            "$PWD/src/unit_tests/generatedScriptTestsNft/test1.fwb" \
            ci-logs/central-hooks 2>&1 | tee ci-logs/central-hooks.log

      - name: Validate generated nftables grammar with nft --check
        run: |
          set -euo pipefail
          command -v nft
          nft --version
          shopt -s nullglob
          policies=(ci-logs/nft-output/*.fw)
          test "${#policies[@]}" -gt 0 || {
            echo 'No generated nftables policy found' >&2
            exit 1
          }
          # nft --check parses and validates without applying any kernel rules.
          sudo sh ci/check-nft-syntax.sh "${policies[@]}" \
            2>&1 | tee ci-logs/nft-native-syntax.log

      - name: Publish build logs to ci-logs-nftables branch
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -rf ci-log-repo && git init -q ci-log-repo && cd ci-log-repo
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          cp -r "$GITHUB_WORKSPACE/ci-logs" .
          git add -A
          git commit -qm "CI build logs for failed run $GITHUB_RUN_ID"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/haubentaucher/fwbuilder.git" HEAD:refs/heads/ci-logs-nftables

      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fwbuilder-nftables-qt5-logs
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14
